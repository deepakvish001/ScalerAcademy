name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Submit...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Ruby, browser, and operating-system versions
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and personal email addresses before posting.
