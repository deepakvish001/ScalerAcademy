name: Feature request
description: Propose an improvement to interview scheduling
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
