name: Rails tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.1"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: bin/rails db:prepare
      - run: bin/rails test
